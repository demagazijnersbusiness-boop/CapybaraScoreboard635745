name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: mvn -B clean package
        working-directory: capybara-v4
      - uses: actions/upload-artifact@v4
        with:
          name: CapybaraScoreboard
          path: capybara-v4/target/CapybaraScoreboard-1.0.0.jar
